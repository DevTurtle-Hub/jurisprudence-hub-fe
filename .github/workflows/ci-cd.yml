name: CI/CD Pipeline - Test & Build Before Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # =========================================================================
  # GIAI ĐOẠN 1: KIỂM THỬ VÀ BIÊN DỊCH (TEST & BUILD)
  # =========================================================================
  test-and-build:
    name: 🧪 Run Tests & Build Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Code Quality & Linter
        run: npm run lint

      - name: 🧪 Run Automated Unit Tests
        run: npm test

      - name: 🏗️ Run Type Check & Production Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7

  # =========================================================================
  # GIAI ĐOẠN 2: TRIỂN KHAI (DEPLOY) - CHỈ CHẠY KHI TEST & BUILD THÀNH CÔNG
  # =========================================================================
  deploy:
    name: 🚀 Deploy to Production
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist/

      - name: ✅ Ready for Deployment
        run: |
          echo "=========================================================="
          echo "All tests, lint checks, and type-checks passed successfully!"
          echo "Ready to deploy 'dist' folder to Web Server / Cloud Hosting."
          echo "=========================================================="
          ls -lh dist/
