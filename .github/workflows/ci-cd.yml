name: CI/CD Pipeline - Test & Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # =========================================================================
  # GIAI ĐOẠN 1: KIỂM THỬ VÀ BIÊN DỊCH (TEST & BUILD TRƯỚC KHI DEPLOY)
  # =========================================================================
  test-and-build:
    name: 🧪 Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Code Quality & Linter
        run: npm run lint

      - name: 🧪 Run Automated Unit Tests
        run: npm test

      - name: 🏗️ Run Type Check & Production Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}

  # =========================================================================
  # GIAI ĐOẠN 2: TỰ ĐỘNG DEPLOY LÊN VERCEL KHI TẤT CẢ TEST ĐÃ PASSED
  # =========================================================================
  deploy-to-vercel:
    name: 🚀 Deploy to Vercel Production
    needs: test-and-build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🔐 Validate Vercel Secrets Configuration
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            MISSING_SECRETS="$MISSING_SECRETS VERCEL_TOKEN"
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            MISSING_SECRETS="$MISSING_SECRETS VERCEL_ORG_ID"
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            MISSING_SECRETS="$MISSING_SECRETS VERCEL_PROJECT_ID"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "=========================================================="
            echo "❌ LỖI: Chưa cấu hình các GitHub Secrets sau:$MISSING_SECRETS"
            echo "=========================================================="
            echo "Để Vercel CLI có quyền deploy tự động, bạn cần thêm 3 Secrets vào GitHub:"
            echo "👉 Vào: GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "   1. VERCEL_TOKEN: Token từ https://vercel.com/account/tokens"
            echo "   2. VERCEL_ORG_ID: Team ID hoặc User ID trên Vercel"
            echo "   3. VERCEL_PROJECT_ID: Project ID trong Settings của Project trên Vercel"
            echo "=========================================================="
            exit 1
          fi
          echo "✅ Đã tìm thấy đầy đủ Vercel Secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)!"

      - name: 📥 Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Project Artifacts on Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}

      - name: 🚀 Deploy Prebuilt Artifacts to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "=========================================================="
          echo "🎉 ĐÃ DEPLOY THÀNH CÔNG LÊN VERCEL!"
          echo "🌐 Production URL: $DEPLOY_URL"
          echo "=========================================================="

      - name: 📝 Post Deployment Summary to GitHub
        run: |
          echo "### 🚀 Vercel Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
